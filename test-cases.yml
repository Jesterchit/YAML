---
- summary: |
    Отображение каталога товаров на главной странице
  requirement: |
    Пользователь должен иметь возможность просматривать товары
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    —
  steps:
    - Открыть https://products-store.hexlet.app/
  expected-result: |
    Отображается список товаров
    У каждого товара видны название, рейтинг, цена со скидкой и цена без скидки
    Список товаров не пустой

- summary: |
    Поиск товара по ключевому слову возвращает релевантные результаты
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    Ключевое слово = "phone"
  steps:
    - Ввести "phone" в поле поиска
    - Нажать Enter / кнопку поиска
  expected-result: |
    В каталоге отображаются только товары, в названии которых есть "phone"
    Количество товаров уменьшилось по сравнению с полным каталогом

- summary: |
    Поиск по несуществующему запросу показывает пустой результат
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    Ключевое слово = "qwertyuiop12345"
  steps:
    - Ввести "qwertyuiop12345" в поле поиска
    - Нажать Enter / кнопку поиска
  expected-result: |
    Отображается пустой список товаров или сообщение "Ничего не найдено"
    Сайт не зависает и не показывает все товары подряд

- summary: |
    Фильтрация товаров по категории
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыта главная страница магазина, запомнено общее количество товаров в каталоге
  test-data: |
    Категория = "smartphones"
  steps:
    - Выбрать категорию "smartphones" в фильтре
  expected-result: |
    Список товаров содержит только товары выбранной категории
    Количество товаров меньше, чем в полном каталоге
    Фильтр визуально отмечен как активный

- summary: |
    Постраничный вывод товаров без перезагрузки страницы
  requirement: |
    Пользователь будет пользоваться постраничным выводом
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    —
  steps:
    - Прокрутить каталог до пагинации
    - Нажать на следующую страницу
  expected-result: |
    Отображается следующая страница товаров
    Страница не перезагружается (SPA), состояние обновляется без полной перезагрузки

- summary: |
    Просмотр подробной информации о товаре
  requirement: |
    Пользователь должен иметь возможность просматривать подробную информацию о товаре
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    —
  steps:
    - Нажать на карточку товара
  expected-result: |
    Открывается страница товара
    На странице видны название, рейтинг, цена со скидкой и без неё, описание товара
    Описание товара не пустое

- summary: |
    Добавление товара в корзину из каталога
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites: |
    Открыта главная страница магазина, корзина пуста
  test-data: |
    —
  steps:
    - Нажать кнопку "В корзину" на карточке товара
    - Перейти в корзину
  expected-result: |
    Товар отображается в корзине
    Счётчик корзины увеличился на 1

- summary: |
    Добавление нескольких разных товаров в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites: |
    Открыта главная страница магазина, корзина пуста
  test-data: |
    —
  steps:
    - Добавить в корзину товар A
    - Добавить в корзину товар B
    - Открыть корзину
  expected-result: |
    В корзине отображаются оба товара
    Счётчик корзины равен 2

- summary: |
    Удаление товара из корзины
  requirement: |
    На странице корзины пользователь сможет удалить товар из корзины
  prerequisites: |
    В корзине есть хотя бы один товар
  test-data: |
    —
  steps:
    - Открыть корзину
    - Нажать иконку "X" (удалить) рядом с товаром
  expected-result: |
    Товар исчезает из списка корзины
    Счётчик корзины уменьшился на 1

- summary: |
    Удаление последнего товара из корзины показывает пустую корзину
  requirement: |
    На странице корзины пользователь сможет удалить товар из корзины
  prerequisites: |
    В корзине ровно один товар
  test-data: |
    —
  steps:
    - Открыть корзину
    - Удалить единственный товар
  expected-result: |
    Отображается сообщение о пустой корзине
    Счётчик корзины равен 0

- summary: |
    Оформление заказа с переходом на страницу оплаты
  requirement: |
    Пользователь сможет оформить заказ с переходом на страницу оплаты
  prerequisites: |
    В корзине есть хотя бы один товар
  test-data: |
    —
  steps:
    - Открыть корзину
    - Нажать кнопку "Оформить заказ"
  expected-result: |
    Происходит переход на страницу оплаты

- summary: |
    Оформление заказа с пустой корзиной не переводит на страницу оплаты
  requirement: |
    Пользователь сможет оформить заказ с переходом на страницу оплаты
  prerequisites: |
    Корзина пуста
  test-data: |
    —
  steps:
    - Открыть корзину
    - Нажать кнопку "Оформить заказ"
  expected-result: |
    Переход на страницу оплаты не происходит
    Отображается сообщение о том, что корзина пуста, либо кнопка недоступна

- summary: |
    Сохранение корзины в сессии браузера после перезагрузки страницы
  requirement: |
    Корзина будет храниться в сессии браузера
  prerequisites: |
    В корзину добавлен товар
  test-data: |
    —
  steps:
    - Добавить товар в корзину
    - Открыть DevTools → Application → Session Storage
    - Обновить страницу (F5)
    - Открыть корзину
  expected-result: |
    В Session Storage присутствует запись с данными корзины
    После F5 товар остаётся в корзине

- summary: |
    Переключение языка интерфейса на английский
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    Язык = English
  steps:
    - Переключить язык на English
  expected-result: |
    Заголовки, кнопки, названия фильтров и категорий отображаются на английском
    Ни один элемент интерфейса не остался на русском языке

- summary: |
    Адаптивная верстка на мобильном устройстве
  requirement: |
    Сайт должен иметь мобильную версию
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    Ширина экрана = 375px (DevTools)
  steps:
    - Открыть DevTools, включить режим мобильного устройства
    - Проверить отображение карточек товаров и панели фильтров
    - Нажать кнопку "В корзину" на карточке товара
    - Открыть корзину через иконку
  expected-result: |
    Горизонтальной прокрутки страницы нет
    Карточки товаров не перекрывают друг друга и панель фильтров
    Кнопка "В корзину" нажимается и товар добавляется
    Иконка корзины видна и открывает корзину

- summary: |
    Отображение цены со скидкой и без неё на странице товара
  requirement: |
    На странице товара нужно выводить цену со скидкой и без неё
  prerequisites: |
    Открыта страница товара, у которого есть скидка
  test-data: |
    —
  steps:
    - Открыть карточку товара со скидкой
  expected-result: |
    Отображаются обе цены: исходная (зачёркнутая) и цена со скидкой
    Цена со скидкой меньше исходной цены
