---
- summary: |
    Отображение каталога товаров на главной странице
  requirement: |
    Пользователь должен иметь возможность просматривать товары
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    —
  steps:
    - Открыть https://products-store.hexlet.app/
  expected-result: |
    Отображается список товаров
    У каждого товара видны название, рейтинг, цена со скидкой и цена без скидки
    Список товаров не пустой

- summary: |
    Поиск товара по ключевому слову возвращает релевантные результаты
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites: |
    Открыта главная страница магазина, запомнено общее количество товаров в каталоге
  test-data: |
    Ключевое слово = "стол"
  steps:
    - Ввести "стол" в поле поиска
    - Нажать Enter / кнопку поиска
  expected-result: |
    В каталоге отображаются только товары, в названии которых есть "стол"
    Количество товаров уменьшилось по сравнению с полным каталогом

- summary: |
    Поиск по несуществующему запросу показывает пустой результат
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    Ключевое слово = "qwertyuiop12345"
  steps:
    - Ввести "qwertyuiop12345" в поле поиска
    - Нажать Enter / кнопку поиска
  expected-result: |
    Отображается пустой список товаров или сообщение "Ничего не найдено"
    Сайт не зависает и не показывает все товары подряд

- summary: |
    Поиск товаров по категории
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    Категория = "Продукты"
  steps:
    - Выбрать категорию "Продукты" в поиске/фильтре категорий
  expected-result: |
    В каталоге отображаются только товары категории "Продукты"
    Среди товаров нет мебели и косметики

- summary: |
    Фильтрация товаров по категории
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыта главная страница магазина, запомнено общее количество товаров в каталоге
  test-data: |
    Категория = "Мебель"
  steps:
    - Выбрать категорию "Мебель" в фильтре
  expected-result: |
    Список товаров содержит только товары категории "Мебель"
    Количество товаров меньше, чем в полном каталоге
    Фильтр визуально отмечен как активный

- summary: |
    Постраничный вывод товаров без перезагрузки страницы
  requirement: |
    Пользователь будет пользоваться постраничным выводом
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    —
  steps:
    - Прокрутить каталог до пагинации
    - Нажать на следующую страницу
  expected-result: |
    Отображается следующая страница товаров
    Страница не перезагружается (SPA), состояние обновляется без полной перезагрузки

- summary: |
    Просмотр подробной информации о товаре
  requirement: |
    Пользователь должен иметь возможность просматривать подробную информацию о товаре
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    —
  steps:
    - Нажать на карточку любого товара (например, стул или крем для лица)
  expected-result: |
    Открывается страница товара
    На странице видны название, рейтинг, цена со скидкой и без неё, описание товара
    Описание товара не пустое

- summary: |
    Добавление товара в корзину из каталога
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites: |
    Открыта главная страница магазина, корзина пуста
  test-data: |
    —
  steps:
    - Нажать кнопку "В корзину" на карточке товара
    - Перейти в корзину
  expected-result: |
    Товар отображается в корзине
    Счётчик корзины увеличился на 1

- summary: |
    Добавление нескольких разных товаров из разных категорий в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites: |
    Открыта главная страница магазина, корзина пуста
  test-data: |
    Товар A = любой товар категории "Мебель"
    Товар B = любой товар категории "Продукты"
  steps:
    - Добавить в корзину товар A
    - Добавить в корзину товар B
    - Открыть корзину
  expected-result: |
    В корзине отображаются оба товара
    Счётчик корзины равен 2

- summary: |
    Удаление товара из корзины
  requirement: |
    На странице корзины пользователь сможет удалить товар из корзины
  prerequisites: |
    В корзине есть хотя бы один товар
  test-data: |
    —
  steps:
    - Открыть корзину
    - Нажать иконку "X" (удалить) рядом с товаром
  expected-result: |
    Товар исчезает из списка корзины
    Счётчик корзины уменьшился на 1

- summary: |
    Удаление последнего товара из корзины показывает пустую корзину
  requirement: |
    На странице корзины пользователь сможет удалить товар из корзины
  prerequisites: |
    В корзине ровно один товар
  test-data: |
    —
  steps:
    - Открыть корзину
    - Удалить единственный товар
  expected-result: |
    Отображается сообщение о пустой корзине
    Счётчик корзины равен 0

- summary: |
    Оформление заказа с переходом на страницу оплаты
  requirement: |
    Пользователь сможет оформить заказ с переходом на страницу оплаты
  prerequisites: |
    В корзине есть хотя бы один товар
  test-data: |
    —
  steps:
    - Открыть корзину
    - Нажать кнопку "Оформить заказ"
  expected-result: |
    Происходит переход на страницу оплаты

- summary: |
    Оформление заказа с пустой корзиной не переводит на страницу оплаты
  requirement: |
    Пользователь сможет оформить заказ с переходом на страницу оплаты
  prerequisites: |
    Корзина пуста
  test-data: |
    —
  steps:
    - Открыть корзину
    - Нажать кнопку "Оформить заказ"
  expected-result: |
    Переход на страницу оплаты не происходит
    Отображается сообщение о том, что корзина пуста, либо кнопка недоступна

- summary: |
    Сохранение корзины в сессии браузера после перезагрузки страницы
  requirement: |
    Корзина будет храниться в сессии браузера
  prerequisites: |
    В корзину добавлен товар (например, любой товар категории "Продукты")
  test-data: |
    —
  steps:
    - Добавить товар в корзину
    - Открыть DevTools → Application → Session Storage
    - Обновить страницу (F5 / Cmd + R)
    - Открыть корзину
  expected-result: |
    В Session Storage присутствует запись с данными корзины
    После перезагрузки товар остаётся в корзине

- summary: |
    Переключение языка интерфейса на английский
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    Язык = English
  steps:
    - Переключить язык на English
  expected-result: |
    Заголовки, кнопки, названия фильтров и категорий (Furniture, Groceries, Cosmetics) отображаются на английском
    Ни один элемент интерфейса не остался на русском языке

- summary: |
    Переключение языка интерфейса обратно на русский
  requirement: |
    Сайт должен иметь локализацию (перевод) на русский и английский языки
  prerequisites: |
    Язык интерфейса переключён на English
  test-data: |
    Язык = Русский
  steps:
    - Переключить язык интерфейса на Русский
  expected-result: |
    Все элементы интерфейса отображаются на русском языке
    Ни один элемент не остался на английском

- summary: |
    Адаптивная верстка при эмуляции узкого экрана в DevTools
  requirement: |
    Сайт должен иметь мобильную версию
  prerequisites: |
    Открыта главная страница магазина в браузере на ноутбуке
  test-data: |
    Ширина экрана = 375px (режим эмуляции устройства в DevTools)
  steps:
    - Открыть DevTools (Cmd + Option + I)
    - Включить режим эмуляции устройства (Cmd + Shift + M)
    - Выбрать ширину экрана 375px (например, iPhone SE/12)
    - Проверить отображение карточек товаров и панели фильтров
    - Нажать кнопку "В корзину" на карточке товара
    - Открыть корзину через иконку
  expected-result: |
    Горизонтальной прокрутки страницы нет
    Карточки товаров не перекрывают друг друга и панель фильтров
    Кнопка "В корзину" нажимается и товар добавляется
    Иконка корзины видна и открывает корзину

- summary: |
    Отображение цены со скидкой и без неё на странице товара
  requirement: |
    На странице товара нужно выводить цену со скидкой и без неё
  prerequisites: |
    Открыта страница товара, у которого есть скидка
  test-data: |
    —
  steps:
    - Открыть карточку товара со скидкой (например, любой товар категории "Косметика" со скидкой)
  expected-result: |
    Отображаются обе цены: исходная (зачёркнутая) и цена со скидкой
    Цена со скидкой меньше исходной цены

- summary: |
    Открытие сайта без использования VPN
  requirement: |
    Сайт должен быть доступен для пользователей без использования VPN
  prerequisites: |
    VPN отключён, открыт браузер
  test-data: |
    —
  steps:
    - Отключить VPN
    - Открыть https://products-store.hexlet.app/
  expected-result: |
    Сайт открывается и каталог товаров загружается без ошибок
    Перенаправления на страницу-заглушку или ошибки соединения нет

- summary: |
    Открытие сайта в последних версиях браузеров
  requirement: |
    Сайт нужно протестировать на совместимость с последними версиями браузеров
  prerequisites: |
    Установлены актуальные версии Chrome, Firefox, Safari
  test-data: |
    Браузеры = Chrome, Firefox, Safari (последние версии)
  steps:
    - Открыть сайт в Chrome
    - Открыть сайт в Firefox
    - Открыть сайт в Safari
  expected-result: |
    Во всех браузерах каталог отображается корректно
    Основные сценарии (поиск, фильтр, корзина) работают без визуальных и функциональных ошибок

- summary: |
    Скорость загрузки главной страницы
  requirement: |
    Сайт нужно разработать с учетом удобства использования и оптимизировать для скорости работы
  prerequisites: |
    Открыта главная страница магазина, DevTools → вкладка Network
  test-data: |
    —
  steps:
    - Открыть DevTools → Network
    - Обновить страницу (Cmd + R)
    - Посмотреть время загрузки (Load time) и размер ресурсов
  expected-result: |
    Страница загружается полностью менее чем за 3 секунды
    Нет ресурсов, загружающихся дольше 2 секунд

- summary: |
    Передача данных по защищённому соединению HTTPS
  requirement: |
    Сайт должен быть безопасным и защищать данные пользователя
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    —
  steps:
    - Открыть сайт
    - Проверить протокол в адресной строке и иконку замка
    - Открыть DevTools → Network и проверить схему запросов
  expected-result: |
    Сайт открывается по HTTPS
    Все запросы к API идут по HTTPS
    Браузер не показывает предупреждений о небезопасном соединении

- summary: |
    Корзина очищается после оформления заказа
  requirement: |
    Пользователь сможет оформить заказ с переходом на страницу оплаты
  prerequisites: |
    В корзине есть хотя бы один товар
  test-data: |
    —
  steps:
    - Открыть корзину
    - Нажать кнопку "Оформить заказ"
    - Завершить оформление заказа
    - Открыть корзину повторно
  expected-result: |
    Корзина пуста
    Счётчик корзины равен 0
