---
- summary: |
    Фильтр по категории не применяется к списку товаров
  environment: |
    https://products-store.hexlet.app/
    Google Chrome 120.0.6099.130 (Официальная сборка) (64 бит)
    ОС Linux 22.04
  steps-to-reproduce: |
    1. Открыть https://products-store.hexlet.app/
    2. Выбрать категорию "smartphones" в фильтре слева
    3. Посмотреть на список товаров
  expected-result: |
    В каталоге отображаются только товары выбранной категории
  actual-result: |
    Список товаров не меняется — отображаются товары всех категорий

- summary: |
    Кнопка "Оформить заказ" не переводит на страницу оплаты
  environment: |
    https://products-store.hexlet.app/
    Google Chrome 120.0.6099.130 (Официальная сборка) (64 бит)
    ОС Linux 22.04
  steps-to-reproduce: |
    1. Добавить любой товар в корзину
    2. Открыть корзину
    3. Нажать кнопку "Оформить заказ"
  expected-result: |
    Происходит переход на страницу оплаты
  actual-result: |
    Ничего не происходит, страница оплаты не открывается
    В консоли DevTools ошибок нет

- summary: |
    Нарушена адаптивная верстка на мобильном разрешении
  environment: |
    https://products-store.hexlet.app/
    Google Chrome 120.0.6099.130, режим устройства iPhone 12 (390x844)
    ОС Linux 22.04
  steps-to-reproduce: |
    1. Открыть сайт в DevTools в режиме мобильного устройства
    2. Посмотреть на карточки товаров и фильтр
  expected-result: |
    Элементы интерфейса не перекрываются, всё доступно и читаемо
  actual-result: |
    Фильтр наезжает на карточки товаров, часть текста обрезана
    Скриншот: assets/mobile-bug.png
