---
- summary: |
    Часть текстов интерфейса не переводится на английский язык
  environment: |
    https://products-store.hexlet.app/
    Google Chrome (последняя версия), macOS на MacBook Air 13
    Десктопный режим (без эмуляции устройства)
  steps-to-reproduce: |
    1. Открыть главную страницу магазина
    2. Переключить язык интерфейса на English
    3. Просмотреть заголовки, кнопки, названия фильтров и категорий
  expected-result: |
    Все элементы интерфейса отображаются на английском языке
  actual-result: |
    Часть элементов осталась на русском языке (например, кнопка "В корзину", названия категорий)
    Перевод применяется не ко всем элементам интерфейса

- summary: |
    После переключения языка интерфейс обновляется с задержкой
  environment: |
    https://products-store.hexlet.app/
    Google Chrome (последняя версия), macOS на MacBook Air 13
    Десктопный режим (без эмуляции устройства)
  steps-to-reproduce: |
    1. Открыть главную страницу магазина
    2. Переключить язык интерфейса на English
    3. Наблюдать за обновлением текстов на странице
  expected-result: |
    Все тексты интерфейса обновляются мгновенно после переключения языка
  actual-result: |
    Часть текстов остаётся на прежнем языке на несколько секунд
    Полное обновление интерфейса происходит с заметной задержкой

- summary: |
    При обратном переключении языка часть текстов остаётся на английском
  environment: |
    https://products-store.hexlet.app/
    Google Chrome (последняя версия), macOS на MacBook Air 13
    Десктопный режим (без эмуляции устройства)
  steps-to-reproduce: |
    1. Переключить язык интерфейса на English
    2. Переключить язык интерфейса обратно на Русский
    3. Просмотреть элементы интерфейса
  expected-result: |
    Все элементы интерфейса отображаются на русском языке
  actual-result: |
    Часть элементов осталась на английском языке после обратного переключения

- summary: |
    Кнопка "Hexlet store" не возвращает на главную страницу
  environment: |
    https://products-store.hexlet.app/
    Google Chrome (последняя версия), macOS на MacBook Air 13
    Десктопный режим (без эмуляции устройства)
  steps-to-reproduce: |
    1. Открыть сайт и перейти на любую внутреннюю страницу (карточка товара / корзина)
    2. Нажать на логотип/кнопку "Hexlet store" в шапке сайта
  expected-result: |
    Происходит переход на главную страницу каталога товаров
  actual-result: |
    Переход на главную страницу не происходит
    Пользователь остаётся на текущей странице

- summary: |
    Фильтр по категории не применяется к списку товаров
  environment: |
    https://products-store.hexlet.app/
    Google Chrome (последняя версия), macOS на MacBook Air 13
    Десктопный режим (без эмуляции устройства)
  steps-to-reproduce: |
    1. Открыть https://products-store.hexlet.app/
    2. Выбрать категорию "Мебель" в фильтре
    3. Посмотреть на список товаров
  expected-result: |
    В каталоге отображаются только товары категории "Мебель"
    Количество товаров меньше, чем в полном каталоге
  actual-result: |
    Список товаров не меняется — отображаются товары всех категорий
    Фильтр визуально выбран, но список не отфильтрован

- summary: |
    При эмуляции узкого экрана в DevTools панель фильтров перекрывает карточки товаров
  environment: |
    https://products-store.hexlet.app/
    Google Chrome (последняя версия), macOS на MacBook Air 13
    DevTools → режим эмуляции устройства, ширина 375px (iPhone SE/12)
  steps-to-reproduce: |
    1. Открыть сайт в Chrome на MacBook
    2. Открыть DevTools (Cmd + Option + I)
    3. Включить режим эмуляции устройства (Cmd + Shift + M)
    4. Выбрать ширину экрана 375px
    5. Открыть панель фильтров
  expected-result: |
    Панель фильтров не перекрывает карточки товаров
    Горизонтальной прокрутки страницы нет
  actual-result: |
    Панель фильтров наезжает на карточки, часть контента недоступна
    Появляется горизонтальная прокрутка
