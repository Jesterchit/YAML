---
- summary: |
    Фильтр по категории не применяется к списку товаров
  environment: |
    https://products-store.hexlet.app/
    Google Chrome (последняя версия), macOS на MacBook Air 13
    Эмуляция не используется (десктопный режим)
  steps-to-reproduce: |
    1. Открыть https://products-store.hexlet.app/
    2. Выбрать категорию "Мебель" в фильтре слева
    3. Посмотреть на список товаров
  expected-result: |
    В каталоге отображаются только товары категории "Мебель"
    Количество товаров меньше, чем в полном каталоге
  actual-result: |
    Список товаров не меняется — отображаются товары всех категорий
    Фильтр визуально выбран, но список не отфильтрован

- summary: |
    Кнопка "Оформить заказ" не переводит на страницу оплаты
  environment: |
    https://products-store.hexlet.app/
    Google Chrome (последняя версия), macOS на MacBook Air 13
    Эмуляция не используется (десктопный режим)
  steps-to-reproduce: |
    1. Добавить любой товар в корзину
    2. Открыть корзину
    3. Нажать кнопку "Оформить заказ"
  expected-result: |
    Происходит переход на страницу оплаты
  actual-result: |
    Ничего не происходит, страница оплаты не открывается
    В консоли DevTools ошибок нет

- summary: |
    При эмуляции узкого экрана в DevTools элементы интерфейса перекрываются
  environment: |
    https://products-store.hexlet.app/
    Google Chrome (последняя версия), macOS на MacBook Air 13
    DevTools → режим эмуляции устройства, ширина 375px (iPhone SE/12)
  steps-to-reproduce: |
    1. Открыть сайт в Chrome на MacBook
    2. Открыть DevTools (Cmd + Option + I)
    3. Включить режим эмуляции устройства (Cmd + Shift + M)
    4. Выбрать ширину экрана 375px
    5. Посмотреть на карточки товаров и панель фильтров
  expected-result: |
    Горизонтальной прокрутки страницы нет
    Карточки товаров не перекрывают друг друга и панель фильтров
    Кнопка "В корзину" нажимается
  actual-result: |
    Панель фильтров наезжает на карточки товаров, часть текста обрезана
    Появляется горизонтальная прокрутка страницы
    Скриншот: assets/mobile-bug.png

- summary: |
    Удалённый товар возвращается в корзину после перезагрузки страницы
  environment: |
    https://products-store.hexlet.app/
    Google Chrome (последняя версия), macOS на MacBook Air 13
    Эмуляция не используется (десктопный режим)
  steps-to-reproduce: |
    1. Добавить товар в корзину
    2. Открыть корзину
    3. Удалить товар через иконку "X"
    4. Обновить страницу (Cmd + R)
    5. Открыть корзину
  expected-result: |
    После перезагрузки корзина остаётся пустой
    Удалённый товар не возвращается
  actual-result: |
    После перезагрузки удалённый товар снова отображается в корзине
    Счётчик корзины снова равен 1

- summary: |
    Часть текстов интерфейса не переводится на английский язык
  environment: |
    https://products-store.hexlet.app/
    Google Chrome (последняя версия), macOS на MacBook Air 13
    Эмуляция не используется (десктопный режим)
  steps-to-reproduce: |
    1. Открыть главную страницу магазина
    2. Переключить язык на English
    3. Просмотреть заголовки, кнопки, названия фильтров и категорий
  expected-result: |
    Все элементы интерфейса отображаются на английском языке
  actual-result: |
    Часть элементов осталась на русском (например, кнопка "В корзину" и название категории "Продукты")
    Скриншот: assets/i18n-bug.png
